<svg width="100%" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @keyframes gradientBackground {
          0% { background-position: 0% 50%; }
          50% { background-position: 100% 50%; }
          100% { background-position: 0% 50%; }
        }

        @keyframes fadeBlink {
          0%, 100% { opacity: 1; }
          50% { opacity: 0.2; }
        }

        .container {
          width: 1200px;
          height: 300px;
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          background: linear-gradient(-45deg, #fc5c7d, #6a82fb, #05dfd7);
          background-size: 600% 400%;
          animation: gradientBackground 12s ease infinite;
          color: white;
          font-family: system-ui, Arial, sans-serif;
          text-align: center;
          border-radius: 12px;
        }

        .title {
          font-size: 48px;
          font-weight: bold;
          letter-spacing: 3px;
          margin-bottom: 10px;
          text-shadow:
            0 2px 5px rgba(0,0,0,0.2);
          animation: fadeBlink 5s infinite;
        }

        .subtitle {
          font-size: 22px;
          opacity: 0.9;
          animation: fadeBlink 3s infinite;
          animation-delay: 1s;
        }

        /* Responsive fallback */
        @media (max-width: 600px) {
          .container {
            width: 100%;
            height: 200px;
          }
          .title {
            font-size: 28px;
          }
          .subtitle {
            font-size: 16px;
          }
        }
      </style>

      <div class="container">
        <div class="title">🚀 WAYANG</div>
        <div class="subtitle">Smartkey • Controller • Synfig plugin</div>
      </div>
    </div>
  </foreignObject>
</svg>

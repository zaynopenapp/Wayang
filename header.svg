<svg width="100%" height="60" viewBox="0 0 500 60">
  <style>
    .marquee {
      font-size: 24px;
      font-family: Arial, sans-serif;
      fill: black;
      animation: jalan 8s linear infinite;
    }

    @keyframes jalan {
      0% {
        transform: translateX(100%);
      }
      100% {
        transform: translateX(-100%);
      }
    }
  </style>

  <text y="35" class="marquee">
    Ini adalah contoh teks berjalan di dalam SVG 🚀
  </text>
</svg>
